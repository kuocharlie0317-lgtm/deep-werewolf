<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《深淵狼人殺》小說閱讀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #cbd5e1; /* Slate 300 */
            line-height: 1.8;
        }

        /* 自定義捲軸 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        .chapter-content p {
            margin-bottom: 1.5rem;
            text-align: justify;
        }

        .chapter-content h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 2rem;
            padding-bottom: 0.5rem;
        }

        .system-msg {
            background-color: rgba(239, 68, 68, 0.1);
            border-left: 4px solid #ef4444;
            padding: 1rem;
            margin: 1.5rem 0;
            color: #fca5a5;
            font-style: italic;
        }

        .thought-msg {
            color: #94a3b8;
            font-style: italic;
        }

        .nav-link.active {
            background-color: #1e293b;
            color: #38bdf8;
            border-left: 3px solid #38bdf8;
        }
        
        /* 側邊欄過渡與陰影動畫 */
        #sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 明體字型選項 */
        .font-serif {
            font-family: 'Noto Serif TC', 'PMingLiU', serif;
        }

        /* --- 閱讀區主題設定 --- */
        .theme-dark { background-color: #020617; color: #cbd5e1; }
        .theme-dark .chapter-content h3 { color: #f8fafc; border-bottom: 1px solid #334155; }
        .theme-dark .divider-line { border-color: #1e293b; }

        .theme-sepia { background-color: #f4ecd8; color: #5c4b37; }
        .theme-sepia .chapter-content h3 { color: #3e2723; border-bottom: 1px solid #d7ccc8; }
        .theme-sepia .divider-line { border-color: #d7ccc8; }
        .theme-sepia .system-msg { background-color: rgba(211, 47, 47, 0.05); color: #d32f2f; border-left-color: #d32f2f; }
        .theme-sepia .thought-msg { color: #795548; }

        .theme-light { background-color: #ffffff; color: #334155; }
        .theme-light .chapter-content h3 { color: #0f172a; border-bottom: 1px solid #e2e8f0; }
        .theme-light .divider-line { border-color: #e2e8f0; }
        .theme-light .system-msg { background-color: rgba(220, 38, 38, 0.05); color: #dc2626; border-left-color: #dc2626; }
        .theme-light .thought-msg { color: #64748b; }
    </style>
</head>
<body class="antialiased text-base font-sans bg-slate-950" id="body-container">

    <!-- 強制滿版防護罩，阻絕 GitHub Pages 預設主題的版面干擾 -->
    <div class="fixed inset-0 w-full h-full flex flex-row overflow-hidden bg-slate-950">
        
        <!-- 遮罩背景：點擊關閉手機側邊欄 -->
        <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 z-40 hidden md:hidden backdrop-blur-sm" onclick="toggleSidebar()"></div>

        <!-- 側邊欄（目錄） -->
        <aside id="sidebar" class="w-64 flex-shrink-0 bg-slate-900 border-r border-slate-800 flex flex-col fixed inset-y-0 left-0 md:relative z-50 transform -translate-x-full md:translate-x-0 shadow-2xl md:shadow-none">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wider">深淵狼人殺</h1>
                    <p class="text-xs text-slate-500 mt-1">Abyss Werewolf</p>
                </div>
                <!-- 手機版目錄關閉按鈕 -->
                <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <div class="p-4 flex-1 overflow-y-auto">
                <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-4 px-3">目錄</h2>
                <nav class="space-y-1">
                    <button onclick="showChapter('intro')" id="btn-intro" class="nav-link w-full text-left px-3 py-2 rounded text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all duration-150 active">
                        作品簡介
                    </button>
                    <button onclick="showChapter('ch1')" id="btn-ch1" class="nav-link w-full text-left px-3 py-2 rounded text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all duration-150">
                        第一章：請勿在狼人殺裡飼養大型犬
                    </button>
                    <button onclick="showChapter('ch2')" id="btn-ch2" class="nav-link w-full text-left px-3 py-2 rounded text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all duration-150">
                        第二章：請不要用體溫挑戰理科生
                    </button>
                    <button onclick="showChapter('ch3')" id="btn-ch3" class="nav-link w-full text-left px-3 py-2 rounded text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all duration-150">
                        第三章：所謂的絕對多數暴力
                    </button>
                    <button onclick="showChapter('ch4')" id="btn-ch4" class="nav-link w-full text-left px-3 py-2 rounded text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all duration-150">
                        第四章：抓到你了，躲在暗處的小狼崽
                    </button>
                    <button onclick="showChapter('ch5')" id="btn-ch5" class="nav-link w-full text-left px-3 py-2 rounded text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all duration-150">
                        第五章：披著神職外衣的跳梁小丑
                    </button>
                    <button onclick="showChapter('ch6')" id="btn-ch6" class="nav-link w-full text-left px-3 py-2 rounded text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all duration-150">
                        第六章：官方領域的降維規則
                    </button>
                </nav>
            </div>
            <div class="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">
                &copy; 2026 深淵方舟記錄檔
            </div>
        </aside>

        <!-- 主閱讀視窗 -->
        <main class="flex-1 flex flex-col h-full relative overflow-hidden">
            <header class="h-16 border-b border-slate-800 bg-slate-900/80 backdrop-blur-sm flex items-center justify-between px-4 sticky top-0 z-20 shadow-sm flex-shrink-0">
                <div class="flex items-center overflow-hidden flex-1 mr-2">
                    <!-- 目錄抽屜觸發器 -->
                    <button onclick="toggleSidebar()" class="p-2 mr-3 text-slate-400 hover:text-white rounded focus:outline-none hover:bg-slate-800 flex-shrink-0" title="開啟目錄">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                    
                    <!-- 頂部快速切換章節下拉選單 -->
                    <div class="relative flex-1 max-w-[200px] md:max-w-[260px]">
                        <select id="chapter-quick-select" onchange="showChapter(this.value)" class="w-full bg-slate-800/90 text-slate-200 border border-slate-700 rounded-lg py-1.5 px-3 pr-8 text-sm focus:outline-none focus:border-sky-500 cursor-pointer appearance-none truncate">
                            <option value="intro">作品簡介</option>
                            <option value="ch1">第一章：請勿在狼人殺裡飼養大型犬</option>
                            <option value="ch2">第二章：請不要用體溫挑戰理科生</option>
                            <option value="ch3">第三章：所謂的絕對多數暴力</option>
                            <option value="ch4">第四章：抓到你了，躲在暗處的小狼崽</option>
                            <option value="ch5">第五章：披著神職外衣的跳梁小丑</option>
                            <option value="ch6">第六章：官方領域的降維規則</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>
                
                <div class="flex items-center gap-2 flex-shrink-0">
                    <!-- 個人資料按鈕 -->
                    <button onclick="openProfile()" class="p-2 text-slate-400 hover:text-white rounded focus:outline-none hover:bg-slate-800 transition-colors" title="個人檔案設定">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </button>
                    
                    <!-- 閱讀設定按鈕 -->
                    <button onclick="toggleSettings()" class="p-2 text-slate-400 hover:text-white rounded focus:outline-none hover:bg-slate-800 transition-colors" title="閱讀設定">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </header>

            <!-- 閱讀進度條 -->
            <div class="h-1 bg-slate-800 w-full z-10 flex-shrink-0">
                <div id="reading-progress" class="h-full bg-sky-500 w-0 transition-all duration-150 ease-out"></div>
            </div>

            <div id="read-area" class="flex-1 overflow-y-auto p-4 sm:p-8 md:p-12 scroll-smooth theme-dark transition-colors duration-300">
                <div class="max-w-3xl mx-auto chapter-content" id="content-container">
                </div>
                
                <div class="max-w-3xl mx-auto mt-8 pt-6 border-t divider-line flex justify-between items-center" id="pagination-container">
                    <button id="btn-prev" onclick="navigateChapter('prev')" class="px-4 py-2 bg-slate-800 text-slate-300 rounded hover:bg-slate-700 hover:text-white transition-colors flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed border border-slate-700 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
                        上一章
                    </button>
                    <button id="btn-next" onclick="navigateChapter('next')" class="px-4 py-2 bg-sky-600 text-white rounded hover:bg-sky-500 transition-colors flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed shadow-md">
                        下一章
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg>
                    </button>
                </div>

                <!-- 互動區域 (按讚與留言) -->
                <div class="max-w-3xl mx-auto mt-8 pt-8 border-t divider-line" id="interaction-container">
                    <!-- 按讚區 -->
                    <div class="flex justify-center mb-8">
                        <button id="btn-like" onclick="toggleLike()" class="flex items-center gap-2 px-8 py-3 bg-slate-800/50 rounded-full hover:bg-slate-700 transition-all text-slate-400 border border-slate-700 shadow-sm">
                            <svg id="like-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                            </svg>
                            <span class="font-medium">喜歡 <span id="like-count" class="ml-1 font-bold">0</span></span>
                        </button>
                    </div>

                    <!-- 留言區 -->
                    <div class="bg-black/10 p-6 rounded-xl border divider-line">
                        <div class="flex justify-between items-center mb-6">
                            <div class="flex items-center gap-3">
                                <h4 class="text-lg font-bold flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                                    </svg>
                                    讀者留言
                                </h4>
                                <!-- 連線狀態燈號 -->
                                <span id="connection-status" class="text-[10px] px-2 py-0.5 rounded border border-amber-500/50 bg-amber-500/10 text-amber-500 flex items-center gap-1 font-medium">
                                    <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span> 單機模式
                                </span>
                            </div>
                            <!-- 分享按鈕 -->
                            <button onclick="shareChapter()" class="flex items-center gap-1 text-sm bg-slate-800 text-slate-300 hover:text-white px-3 py-1.5 rounded-md transition-colors border border-slate-700 shadow-sm">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                                邀請朋友
                            </button>
                        </div>
                        
                        <!-- 留言輸入框 -->
                        <div class="mb-8 flex gap-3">
                            <div id="comment-user-avatar-container" class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center flex-shrink-0 text-slate-300 font-bold shadow-inner overflow-hidden border border-slate-600">
                                <img id="comment-user-avatar" src="" alt="Avatar" class="w-full h-full object-cover hidden">
                                <span id="comment-user-fallback" class="text-sm">匿</span>
                            </div>
                            <div class="flex-1 flex flex-col gap-3">
                                <textarea id="comment-input" rows="2" class="w-full bg-black/20 border border-slate-700/50 rounded-lg p-3 text-sm focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 resize-none transition-colors shadow-inner placeholder-slate-500" placeholder="留下你的想法..."></textarea>
                                <div class="flex justify-between items-center">
                                    <span id="comment-user-name" class="text-xs opacity-70">以 匿名讀者 身分留言</span>
                                    <button onclick="submitComment()" class="px-5 py-2 bg-sky-600 text-white font-medium text-sm rounded-md hover:bg-sky-500 transition-colors shadow-md">發佈留言</button>
                                </div>
                            </div>
                        </div>

                        <!-- 留言列表 -->
                        <div id="comment-list" class="space-y-4">
                            <!-- 留言會由 JS 動態載入 -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 個人資料設定彈窗 -->
    <div id="profile-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-11/12 max-w-md p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-3">
                <h3 class="text-xl font-bold text-white tracking-wider">修復者檔案</h3>
                <button onclick="closeProfile()" class="text-slate-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <!-- 上傳大頭貼 -->
            <div class="flex flex-col items-center gap-4 mb-6">
                <div class="relative group cursor-pointer" onclick="document.getElementById('avatar-upload').click()">
                    <div class="w-24 h-24 rounded-full overflow-hidden border-2 border-slate-700 bg-slate-800 flex items-center justify-center shadow-inner">
                        <img id="profile-avatar-preview" src="" alt="Avatar" class="w-full h-full object-cover hidden">
                        <span id="profile-avatar-fallback" class="text-slate-400 font-bold text-3xl">匿</span>
                    </div>
                    <div class="absolute inset-0 bg-black/60 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </div>
                </div>
                <input type="file" id="avatar-upload" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
                <p class="text-xs text-slate-500">點擊更換專屬大頭貼</p>
            </div>

            <!-- 名稱輸入 -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-400 mb-2">顯示名稱 (代號)</label>
                <input type="text" id="profile-name-input" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-200 focus:outline-none focus:border-sky-500 shadow-inner" placeholder="請輸入您的代號...">
            </div>

            <button onclick="saveProfile()" class="w-full py-3 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-lg transition-colors shadow-md mb-6">
                儲存設定
            </button>

            <!-- 社群帳號連結登入方式 -->
            <div class="border-t border-slate-800 pt-5">
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-4">使用社群帳號登入 / 綁定</p>
                <div class="space-y-3">
                    <!-- LINE 登入按鈕 -->
                    <button onclick="triggerSocialLogin('LINE')" class="w-full flex items-center justify-between px-4 py-3 bg-[#06C755] hover:bg-[#05b04c] text-white rounded-lg transition-colors font-medium text-sm shadow-md">
                        <div class="flex items-center gap-3">
                            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">

                    <p>冰冷。<br>這是一種毫無人情味、彷彿連靈魂都能凍結的機體冷覺，正順著脊椎一路往大腦皮層竄。</p>

                    </div>

                    <p>凌晏看著眼前的規則，嘴角勾起一抹極度冰冷的嘲諷弧度。</p>
                    <p>高達一萬積分才能購買覺醒配方？這意味著在遊戲前期，百分之九十九的玩家都只能是手無寸鐵的「平民」。真是一場把人性放在顯微鏡下烤的大型社會實驗。在這種資訊極度不對等且無法反抗的環境下，猜忌鏈一旦形成，人類根本不需要怪物動手，自己體內的群體恐慌與獵巫本能就會在最短的時間內把同類票死。</p>
                    <p>伴隨著一聲沉悶的氣閥洩壓聲，前方那扇厚重的金屬艙門朝著兩側緩緩滑開。門外，是一條深邃、幽暗的哥德式工業風走廊。</p>
                    <p>走廊寬度足以讓兩輛重型卡車並排通行，兩側高聳的金屬牆面上，每隔十公尺就鑲嵌著一面早已龜裂的厚重防彈玻璃窗，窗外是一片令人窒息的漆黑海面與翻滾的風暴。頂部錯綜複雜的通風管道如同巨獸的腸子般蜿蜒，冷光燈管在積水與機油混雜的地面上，拉出長長的光暈。</p>
                    <p>凌晏邁出步伐，順手在牆角碎裂的急救箱裡撿起了一卷高效止血繃帶和一支軍用快速凝血劑。就在這時，他的手環突然發出尖銳的蜂鳴。</p>

                    <div class="system-msg">
                        「叮咚！全球戰報更新：第198號玩家已在溫室區被潛伏者殘忍撕碎～目前剩餘人數：1999人。大家要加快腳步哦！」
                    </div>

                    <p>空氣中飄散來一絲無法掩蓋的血腥味。<br>凌晏身形迅速貼向金屬牆面的陰影處，探出半個身子觀察。</p>
                    <p>在第一個巨大的十字交會口中央，躺著一具殘骸。那東西有著巨大的狼首與毛茸茸的身軀，此時牠那顆堅硬的銀色顱骨被某種不講道理的蠻力硬生生砸碎了。這顯然是一隻剛要變身、卻中途被當場物理超渡的狼人。</p>
                    <p>而在這灘血窪旁邊，站著一個男人。</p>
                    <p>男人穿著一件黑色作戰服，身材高大挺拔，目測超過一米八五。他手裡正拿著一根從牆上硬生生扯下來的粗壯金屬鋼管，鋼管末端還滴著狼人的血。那寬闊的肩膀和緊繃的肌肉，散發著一股極度危險的野獸氣息。</p>
                    <p>凌晏大腦飛速運轉。他非常理智地得出了一個結論：自己的格鬥技巧在這傢伙面前，大概跟幼稚園學童的早操沒什麼利樣。</p>
                    <p>就在他準備悄無聲息地向後撤退時，那個男人似乎察覺到了什麼，猛地回過頭。</p>
                    <p>四目相對。<br>凌晏全身的肌肉瞬間緊繃。然而下一秒，他卻愣住了。</p>
                    <p>男人的五官深邃英挺，極具攻擊性，但此刻那張臉上卻沒有任何殺氣。相反地，那雙漆黑的眼睛在看到凌晏的瞬間，猛地亮了起來。那是一種非常奇特的眼神，就像是一隻剛在外面跟野狼打完架、渾身是血的護衛犬，轉頭卻看見了自己最喜歡的主人，眼神裡盛滿了毫無保留的親暱與興奮。</p>
                    <p>「哇！活人！好乾淨的活人！」</p>
                    <p>男人隨手丟下那根金屬管，以一種極其恐怖的爆發力朝凌晏狂奔而來，在距離他半步的地方來了個緊急煞車。</p>
                    <p>「你好你好！我叫楚戈！」楚戈咧開嘴，指著地上的狼人屍體，彷彿叼著飛盤回來邀功的大狗：「這傢伙剛才說著說著嘴巴突然裂到耳朵根！我一著急，就順手拿管子把牠的腦袋砸扁了！」</p>
                    <p>凌晏沉默地看著他，隨後看了一眼楚戈手環上的代號。<br><strong>【代號：破軍】</strong></p>
                    <p>破軍。北斗第七星，主殺伐。確實是個名副其實的暴力代號。<br>凌晏淡淡地報上自己的名字：「凌晏。」</p>
                    <p>「凌晏？這名字真好聽！」楚戈的眼睛更亮了。他湊近了一點，像隻黏人的大型犬一樣，圍著凌晏轉了半圈。</p>
                    <p>楚戈盯著他看會兒，語氣變得無比認真，甚至透出一絲本能的偏執與強烈的保護欲：「凌晏，你看起來好弱啊。你這樣的，要是碰到剛才那種大狼狗，肯定一口就被吃掉了。不行，你得跟著我。」</p>
                    <p>凌晏看著眼前這隻武力值封頂、大腦結構卻似乎異常單純的「物理系猛男」，推了推並不存在的眼鏡。</p>
                    <p>楚戈擁有絕對的武力，卻對自己展現出了一種近乎盲目的護短。這是一把自願把刀柄遞到他手裡的絕世神兵。如果不加以利用，簡真有辱他犯罪心理學教授的頭銜。</p>
                    <p>「可以組隊。」凌晏嘴角勾起一抹優雅的笑容，「但既然我是你的『大腦』，我的指令，你必須絕對服從。明白嗎？」</p>
                    <p>「沒問題！老大說什麼就是什麼！」楚戈興奮地答應，背後彷彿有一條無形的尾巴在瘋狂搖擺。</p>
                    <p>就在這詭異的「主僕契約」剛達成的瞬間，手環再次發出刺耳的警報聲。</p>

                    <div class="system-msg">
                        「叮咚！全艦進入『黑夜模式』。潛伏者狼人真實型態已解除限制，夜視與狩獵功能全開。祝各位修復者躲貓貓愉快！」
                    </div>

                    <p>走廊上方的冷光燈發出令人牙酸的電流聲，隨後徹底熄滅。黑暗，毫無預兆地席捲了整個方舟。</p>
                    <p>黑暗降臨的瞬間，凌晏感覺到一隻乾燥、溫熱的大手，精準地扣住了他的手腕，一把將他拉到了自己的身後。</p>
                    <p>「凌晏，別怕，我在呢。」楚戈在絕對的黑暗中壓低了聲音，擋在凌晏身前的軀體瞬間繃緊成了一張蓄勢待發的鋼鐵巨弓。</p>
                    <p>「上面通風管裡，有三隻大狼狗爬過來了。」</p>
                `
            },
            'ch2': {
                title: '第二章：請不要用體溫挑戰理科生',
                html: `
                    <h3>第二章：請不要用體溫挑戰理科生</h3>
                    <p>極致的黑暗，往往會無限放大人類對未知的恐懼。</p>
                    <p>但在這伸手不見五指的金屬走廊裡，凌晏的呼吸頻率依然保持在平靜的每分鐘十二次。他背靠著冰冷的牆壁，大腦正飛速讀取著手環剛剛彈出的新提示。</p>
                    
                    <div class="system-msg">
                        「叮咚！檢測到雙方意願，修復者【白夜】與【破軍】已成功建立『戰術小隊』連結。」<br>
                        "小隊特權啟動：隊內友軍傷害豁免、小隊專屬加密通訊頻道開啟、方舟積分共享權限已解鎖。"
                    </div>

                    <p>有了系統層面的綁定，這把名為「楚戈」的凶器才算真正握在了他手裡。</p>
                    <p>「嘎吱——」<br>頭頂的通風管道傳來令人牙酸的金屬形變聲。從震動的頻率來判斷，總共有三隻。</p>
                    <p>「老大，你靠牆站好，別動。」<br>楚戈的聲音透過小隊通訊頻道傳來。下一秒，凌晏感覺到身前那道高大的熱源瞬間消失了。</p>
                    <p>沒有任何戰前預警。<br><strong>「轟——！」</strong></p>
                    <p>一聲震耳之聾的巨響在凌晏正上方炸開。楚戈憑藉著那非人的直覺與爆發力，直接原地起跳，徒手硬生生扯下了天花板上厚重的鋁合金百葉窗！</p>
                    <p>一團巨大的黑影帶著腥臭的狂風被粗暴地拽了下來。楚戈沒有使用任何武器，一拳精準地砸穿了第一隻狼人的胸腔。緊接著又是一腳，第二隻從通風管躍下的狼人甚至還沒落地，就被踹斷了脊椎，砸在牆上沒了動靜。</p>
                    <p>然而，第三隻狼人察覺到了楚戈的不可戰勝。牠悄無聲息地從十米外的另一個排氣孔滑落，直奔角落裡氣息最微弱的凌晏而去！</p>
                    <p>腥風撲面.楚戈遠在十米開外，根本來不及回防。「凌晏！！」通訊頻道裡傳來楚戈目眥欲裂的狂吼。</p>
                    <p>但凌晏沒有驚慌。在黑暗降臨前， his 大腦就已經像掃描儀一樣，將這條走廊的每一個細節刻在了記憶裡——包括左後方兩步距離外，那幾根正劈啪作響冒著火花的高壓裸露電線。</p>
                    <p>在怪物撲過來的那一瞬間，凌晏精準地向右側身滑步。狼人撲了個空，巨大的慣性讓牠重重撞向了高壓電線！</p>
                    <p>「滋啦——！！」<br>強大的電流直接貫穿了怪物的軀體，藍白色電弧爆發，狼人被電得渾身麻痺，攻勢瞬間停滯。</p>
                    <p>就在這短短的一秒鐘內，凌晏冷靜地踏前一步，右手猛地向上抬起——將那支【軍用快速凝血劑】，毫不猶豫地扎進了狼人的眼球裡，大拇指用力一按，將整管凝血劑瞬間推入了怪物的眼眶！</p>
                    <p>劇烈的化學反應讓狼人發出了扭曲的慘叫。</p>
                    <p>「轟！」<br>狂奔而至的楚戈一腳狠狠踩在狼人的頭顱上，將其徹底物理超渡。</p>
                    
                    <div class="system-msg">
                        「叮咚！恭喜戰術小隊成功擊殺三隻潛伏者（初階狼人型態）！」<br>
                        「獲得方舟積分：共 300 點（已存入小隊共享帳戶）。」
                    </div>

                    <p>隨著系統的提示音落下，走廊兩側的應急紅燈再次亮起。</p>
                    <p>楚戈站在一地殘骸中，胸膛劇烈起伏。但他轉頭看向凌晏時，那股殺氣瞬間消失得無影無蹤，取而代之的是震驚與狂熱：「老大……你算準了牠會撞上電線？你太厲害了！」</p>
                    <p>「利用野獸的直線撲咬慣性而已。物理學，不是什麼魔法。」凌晏抽出西裝口袋裡的純白手帕，面無表情地遞了過去，「擦臉。去前面找找物資販賣機。」</p>
                    <p>十五分鐘後。兩人來到了一個較為寬敞的十字路口，找到了系統提到的【物資販賣機】。<br>這是一台充滿賽博龐克風格的黑色金屬機器。螢幕上顯示著：</p>
                    <ul class="list-disc pl-5 mb-4 opacity-90">
                        <li><strong>【初級補給盲盒】</strong> - 售價：100 積分</li>
                        <li><strong>【專屬天賦製作配方自選】</strong> - 售價：10,000 積分</li>
                    </ul>
                    <p>看著那高達一萬積分的配方，凌晏微微挑眉。看來在遊戲初期，想要不靠材料直接購買配方覺醒天賦完全是紙人說夢。</p>
                    <p>「盲盒本質上是利用人類的賭徒心理，但在資訊嚴重匱乏的開局，我們必須購買。」凌晏冷靜下達指令，「我們有300積分，買兩個初級盲盒，剩下的100積分作為應急備用。」</p>
                    <p>楚戈立刻按下按鈕，機器的出口處滾出兩個銀色金屬球。<br>楚戈捏碎第一個。白光一閃，手裡多了一包東西。</p>
                    <p><strong>【獲得物品：極效除菌濕紙巾（100抽）】</strong><br><span class="thought-msg">物品描述：能瞬間擦除任何頑固血漬。請做個愛乾淨的乖孩子。</span></p>
                    <p>「……」楚戈舉著濕紙巾，委屈地看向凌晏，「老大，這機器是不是在嘲諷我？」<br>「不，它很有戰略眼光。把你身上那些會暴露位置的血腥味擦乾淨。」</p>
                    <p>凌晏接過第二個金屬球，優雅地打開。</p>
                    <p><strong>【獲得物品：戰術熱成像單片鏡】</strong><br><span class="thought-msg">物品描述：佩戴後，可穿透一般金屬牆壁探測半徑三十米內的熱源。</span></p>
                    <p>凌晏看著這個道具，深邃的眼眸微微瞇起。<br>「深淵怪物既然被設定為『潛伏者』，這意味著牠們的生物構造必定與常人不同。冷血動物或深淵生物的基礎體溫，絕對無法完美模擬人類的37度恆溫。這東西在前期，比任何未覺醒的天賦都好用。」</p>
                    <p>他將單片鏡戴在左眼上，視野中立刻出現了淡色的數據網格。他抬頭看向楚戈——在熱成像下，楚戈整個人簡直像是一個熊熊燃燒的火爐，生命體徵旺盛得令人髮指，絕對是個純種人類。</p>
                    <p>「走吧，我們去人多的地方。」凌晏推了推單片鏡，嘴角勾起一抹冰冷的笑意，「遊戲，才剛開始。」</p>

                    <div class="text-center my-8 opacity-40">❖ ❖ ❖</div>

                    <p>幾分鐘後，兩人穿過一道沉重的氣壓隔離門，來到了一處類似室內生態園區的巨大中庭。</p>
                    <p>這裡的空間極其開闊，頭頂是高達數十米的巨大半球形防爆玻璃穹頂。穹頂之外，是翻滾著黑色雷雲的絕海風暴，偶爾閃過的慘白閃電，照亮了這座漂浮在無盡深淵上的鋼鐵巨獸。中庭內部則生長著許多不符合地球常理的變異植物，粗壯的藤蔓如同血管般攀爬在周圍的金屬支柱上，散發著微弱的螢光。</p>
                    <p>而在這些奇異植被的包圍下，中央有一個散發著微光、由純白大理石砌成的圓形休閒廣場。此時的廣場上，正聚集著大約十幾男女。他們神情惶恐，有的人身上還帶著傷。</p>
                    <p>在這些人的中央，牆壁上嵌著一個醒目的紅色按鈕——【警報終端】。</p>
                    <p>當凌晏和楚戈走出來時，立刻引起了人群的注意。<br>「站住！別過來！」<br>一個穿著西裝、看似某個企業高管的男人緊張地舉起了一把從盲盒裡開出來的左輪手槍，黑洞洞的槍口對準了滿身殺氣的楚戈。</p>
                    <p>楚戈漆黑的眼睛裡閃過一絲暴戾，剛想動手，肩膀卻被凌晏輕輕按住。<br>「在這種無效射程內，他的手抖得連大象都打不中。別理他。」凌晏透過小隊語音冷靜地下令。楚戈立刻收起殺意，乖順地站在凌晏身後半步的位置。</p>
                    <p>凌晏的目光掃過這群驚魂未定的玩家。透過熱成像單片鏡，他清晰地看到了每個人的體溫分佈。<br>突然，他的視線鎖定了人群最後方、一個穿著連帽衫、瑟瑟發抖的矮小男人。</p>
                    <p>那個男人的體溫呈現出詭異的深藍色——他的體溫比周圍的人低了至少五度，而且心跳頻率異常緩慢。</p>
                    <p>找到了。<br>這就是完美偽裝在人群中的「潛伏者」。</p>
                    <p>就在這時，那個舉著槍的西裝男似乎由於過度恐懼，神經徹底崩潰了。他看著一言不發的凌晏 and 楚戈，崩潰地大喊：「不！你們肯定是怪物！我要啟動投票！我要把你們投出去！」</p>
                    <p>說完，他猛地轉身，狠狠地按下了牆上的【警報終端】！</p>
                    <p>刺耳的紅色警報燈瞬間閃爍，整座深淵方舟發出了震耳欲聾的嗡鳴。</p>

                    <div class="system-msg">
                        「叮咚！檢測到【警報終端】被啟動。」<br>
                        "全艦進入絕對安全停戰模式！第一輪【全體裁決會議】正式開始！"<br>
                        「請各位在接下來的十分鐘內進行發言與投票。得票最高者，將被執行即時神經毒素抹殺。」
                    </div>

                    <p>手環的光芒暴漲，公共通訊界面跳出。<br>西裝男立刻在公共頻道裡聲嘶力竭地吼道：<em>「大家投剛才出現在中庭的兩個人！他們滿身是血，絕對是殺了人的怪物！我是上市公司CEO，我的判斷絕對沒錯！」</em></p>
                    <p>恐慌的情緒是極具傳染性的，無數將信將疑的目光鎖定了凌晏和楚戈，局勢瞬間對他們極度不利。</p>
                    <p>「老大，我不能揍他嗎？」楚戈在小隊語音裡咬牙切齒。<br>「安全模式下物理攻擊無效。」凌晏冷靜地回答，「而且，對付蠢貨，用不著拳頭。」</p>
                    <p>凌晏不慌不忙地啟動了手環的公共通訊功能，平穩、且帶著強烈壓迫感的聲音傳遍了全艦：</p>
                    <p>「上市公司CEO？看來你的危機處理能力跟你的智商一樣，都停留在草履蟲的水平。」</p>
                    <p>凌晏直視著西裝男，語氣如手術刀般精準剖析：「第一，這是一場死亡遊戲，收起你那套可笑的頭銜。第二，我身邊的同伴滿身是黑色的狼血，稍微有點觀察力的人都看得作業我們剛剛在清剿怪物。」</p>
                    <p>他稍微停頓了一下，銳利的目光越過人群，精準地砸在那個躲在最後面、體溫異常的連帽衫男人身上。既然現在沒有真正的預言家技能，那就用物理邏輯來編織一場完美的「驗人報告」。</p>
                    <p>「第三方，與其把票浪費在我們這兩個高戰力的『清道夫』身上……不如請那位躲在角落裡、穿著灰色連帽衫的先生解釋一下。」</p>
                    <p>凌晏的嘴角勾起一抹危險的弧度：「在剛才黑夜模式降臨、暖氣系統停止運作的十五分鐘裡，這裡的氣溫已經降到了攝氏十度以下。所有人都在本能地發抖、呼吸產生白霧。為什麼只有你，既沒有禦寒動作，呼吸也沒有一絲白霧？除非……你體內的恆溫系統根本不是人類，而是一隻不需要靠肺部呼吸凡人空氣的『潛伏者』。」</p>
                    <p>此言一出，全場死寂。<br>所有人轉頭看向連帽衫男人，這才驚恐地發現，對方的呼吸確實沒有一絲白霧！</p>
                    <p>而那個男人的臉上，原本偽裝出的怯懦瞬間僵住，嘴角開始不受控制地向耳根裂開……</p>
                    <p>這就是凌晏。哪怕沒有覺醒任何天賦，他也能用最純粹的智商與觀察力，硬生生打出預言家的壓制力。</p>
                `
            },
            'ch3': {
                title: '第三章：所謂的絕對多數暴力',
                html: `
                    <h3>第三章：所謂的絕對多數暴力</h3>
                    <p>「喀啦……喀啦……」</p>
                    <p>令人毛骨悚然的骨骼錯位聲，在死寂裝庭廣場上顯得無比清晰。<br>那個穿著灰色連帽衫的男人，臉部肌肉開始以一種違反人類生理結構的方式瘋狂抽搐。他的嘴角硬生生撕裂到了耳根，露出兩排參差不齊、帶著黏液的鋒利獠牙；原本藏在袖子裡的雙手，也猛地暴長出十幾公分長的黑色利爪，直接刺穿了布料。</p>
                    <p>他徹底放棄了偽裝。</p>
                    <p>「吼——！！」<br>半人半狼的怪物發出一聲震耳欲聾的咆哮，雙腿猛地彎曲，巨大的爆發力甚至將腳下的大理石地磚踩出蜘蛛網般的裂痕。牠帶著濃烈的腥風，直撲距離最近的西裝男！</p>
                    <p>「啊啊啊裝啊！」<br>上一秒還舉著槍耀武揚威的上市公司CEO，此刻嚇得雙腿發軟，手裡的左輪手槍直接掉在地上，連滾帶爬地往後退。</p>
                    <p>然而，狼人的利爪並沒有撕裂他的喉嚨。<br>裝怪物的爪尖距離西裝男的眼球僅剩不到五公分時，一道淡藍色的半透明六邊形能量護盾憑空出現，硬生生擋下了這致命的一擊。</p>
                    
                    <div class="system-msg">
                        「叮咚！警告！目前處於【全體裁決會議】絕對安全模式，嚴禁任何形式的物理攻擊！」
                    </div>

                    <p>伴隨著系統冰冷的機械音，狼人彷彿撞上了一堵無法逾越的銅牆鐵壁，巨大的反作用力將牠狠狠彈飛了出去，重重摔在地上。</p>
                    <p>「楚戈。」凌晏站在人群邊緣的陰影中，雙手插在西裝褲口袋裡，連眼睛都沒眨一下。<br>「在！老大有什麼吩咐？」楚戈興奮地挺直腰桿。<br>「倒數三十秒。盯緊這群蠢貨的投票動作。」</p>
                    <p>凌晏抬起左腕，指尖在手環的全息螢幕上輕點，隨後透過公共頻道，將冰冷而極具穿透力的聲音砸進每一個陷入恐慌的玩家耳中：</p>
                    <p>「不想死的話，現在立刻打開你們的手環，把票投給【灰燼】。我只給你們十秒鐘。」</p>
                    <p>這句話如同深海裡的氧氣瓶，瞬間喚醒了這群大腦宕機的玩家。<br>沒有人再懷疑凌晏的判斷。在絕對的恐懼與鐵證如山的「物理驗人」面前，凌晏展現出的從容與智商，成為了他們此刻唯一能抓住的救命稻草。</p>
                    <p>「投他！快投那隻怪物！」<br>「我投了！我投了！」</p>
                    <p>所有人都瘋狂地戳擊著手環上的投票介面。那個被彈飛在地的狼人似乎也意識到了什麼，牠發出絕望而憤怒的嘶吼，拚命抓撓著那層看不見的系統護盾，試圖衝出來把投票的人類撕碎，卻無濟於事。</p>

                    <div class="system-msg">
                        「叮咚！投票時間結束。結果統計中……」<br>
                        "修復者【灰燼】獲得最高票數：14 票。決議通過。"<br>
                        「現在執行：即時抹殺。」
                    </div>

                    <p>話音剛落，狼人左腕上那個原本黑色的金屬手環，突然亮起刺眼的紅光。<br>緊接著，三根細如牛毛的探針從手環內側猛地彈出，精準地刺入怪物的靜脈！</p>
                    <p>「嗷嗚——！！」<br>高達百倍劑量的神經毒素在零點一秒內變強制注入。這隻體型超過兩米的深淵怪物，甚至連最後的掙扎都做不到，龐大的身軀瞬間僵直。暗黑色的血液從牠的七竅中瘋狂湧出，隨後像一灘爛泥般重重砸在地上，徹底失去了生命跡象。</p>

                    <div class="system-msg">
                        「叮咚！恭喜各位完成首次放逐。全艦絕對安全模式將在五分鐘後解除。」<br>
                        「黑夜漫長，請繼續努力存活哦～」
                    </div>

                    <p>廣場上鴉雀無聲，只有粗重的喘息聲此起不落。<br>西裝男雙手撐在地上，西裝褲襠處已經濕了一大片。他看著怪物的屍體，又轉頭看向凌晏，眼神裡充滿了敬畏與討好。他連忙爬起身，撿起地上的左輪手槍，快步走到凌晏面前。</p>
                    <p>「位兄弟……不，這位大佬！」西裝男的語氣發生了一百八十度的大轉彎，諂媚地說道：「剛才是我有眼無珠！您一定是覺醒了【預言家】天賦對不對？您太神了！我叫趙大偉，在現實裡資產過億，只要您願意帶上我，出去後我分您一半家產！」</p>
                    <p>周圍的其他玩家見狀，也紛紛反應過來，立刻朝著凌晏湧了過來，七嘴八舌地乞求庇護。</p>
                    <p>面對這群人，凌晏推了推左眼上的熱成像單片鏡，嘴角的弧度降至冰點。</p>
                    <p>「楚戈。」<br>「收到！」</p>
                    <p>楚戈早就看這個姓趙的不順眼了。他一步跨出，高大的身軀宛如一尊煞神般擋在凌晏身前。他什麼也沒說，飾單手捏住了趙大偉手裡那把左輪手槍的槍管，隨後肌肉猛地發力——</p>
                    <p>「嘎吱！」<br>堅硬的精鋼槍管，竟被他硬生生捏扁了！</p>
                    <p>楚戈居高臨下地投視著趙大偉，漆黑的眼眸裡透著毫不掩飾的暴戾與野性，語氣森冷：<br>「離我老大遠一點。再敢靠近一步，我就把你的腦袋捏成這把破槍的形狀。」</p>
                    <p>西裝男嚇得一屁股跌坐在地，連連後退，周圍那些想靠過來的人也瞬間噤若寒蟬，恐懼地退開了三步遠。</p>
                    <p>「我不需要累贅，也不收垃圾。」凌晏越過楚戈寬闊的肩膀，冷冷地掃視著眾人，「剛才救你們，職是因為我需要足夠的票數來啟動系統的抹殺機制。現在，我的目的達到了。」</p>
                    <p>他轉過身，連多看這群人一眼的興趣都沒有，徑直朝著中庭廣場另一側的幽暗通道走去。<br>楚戈立刻像隻得勝的猛犬一樣，乖巧地跟在凌晏身後，臨走前還不忘對著那群人呲了呲牙，發出警告的低吼。</p>
                    <p>兩人重新走入冰冷深邃的金屬走廊。</p>
                    <p>「老大，我們接下來去哪？」楚戈透過小隊語音問道，語氣裡滿是期待。</p>
                    <p>凌晏的大腦飛速運轉。這艘「深淵方舟」的廣闊程度遠超常理，根據剛才終端機洩漏的底層數據，這裡不僅有他們目前所在的『金屬工業板塊』，甚至還連接著『迷霧森林』、『赤紅惡地』、『極寒冰原』等龐大的生態模擬地形。</p>
                    <p>他眼神深邃。<br>「去『動力室』。」凌晏冷靜地分析，「黑夜模式已經持續了快半個小時，怪物的活動頻率卻沒有減少。這艘方舟的能源供給一定有問題。要想掌控這場遊戲的節奏，我們必須先拿到整艘船的硬體控制權。」</p>
                    <p>就在這時，凌晏的手環突然震動了一下。<br>一條只有他能看見的血紅色私人訊息，突兀地彈射在半空中：</p>
                    
                    <div class="system-msg">
                        【匿名訊號接入】：「精彩的邏輯推理。不過，親愛的『預言家』先生，你以為剛才那群人裡面，只有一隻狼嗎？」
                    </div>

                    <p>凌晏的腳步微微一頓。鏡片後的眼神，瞬間變得無比危險。</p>

                    <div class="text-center my-8 opacity-40">❖ ❖ ❖</div>

                    <p>「老大，怎麼了？」楚戈立刻停下腳步，敏銳地察覺到凌晏周身氣壓的轉變，右手本能地握緊了那根沾血的鐵管。</p>
                    <p>「沒什麼，一隻自以為躲在暗處的狼，試圖用資訊差來製造猜忌。」凌晏修長的手指在虛空中一劃，冷漠地將這條血紅色的訊息拉入屏蔽名單。他嘴角勾起一抹玩味的弧度，「不過，這條挑釁訊息倒是幫我證實了這場遊戲更底層的『人數機制』。」</p>
                    <p>「人數機制？」楚戈有些疑惑地歪了歪頭。</p>
                    <p>凌晏一邊邁開長腿繼續前行，一邊以極其清晰的邏輯向這個「物理系隊友」拆解這場殘酷的生存遊戲：</p>
                    <p>「系統開局就宣布，這場遊戲總共有 <strong>2000 名人類菁英</strong> 共同登入。楚戈，你想過沒有，如果每次拍響警報，都要這兩千人同時進入同一個公共頻道進行發言 and 投票，會發生什麼事？」</p>
                    <p>楚戈認真地想了想，隨後搖搖頭：「那場面肯定比菜市場還亂，兩千人一起吵架，估計十分鐘過去了，連第一個發言的人都還沒講完。」</p>
                    <p>「沒錯。這就是關鍵。」凌晏推了推左眼上的熱成像單片鏡，鏡片在黑暗中閃爍著幽綠的光芒：<br>「所以，系統絕對採用了<strong>『分區動態計票』</strong>的規則。整艘深淵方舟被劃分成了無數個獨立的區域。只有當某個區域的『警報終端』被拍響時，<strong>身處該區域及周邊通道的玩家</strong>，才會被強制拉入那一輪的裁決會議。」</p>
                    <p>凌晏伸出兩根手指：<br>「剛才在中庭，加上你、我，以及那隻偽裝成連帽衫的狼人，我們那個區域總共聚集了 <strong>15 個人</strong>。」<br>「因為那隻狼人是被指控的目標，失去了投票權，所以最終的有效票數是 <strong>14 票</strong>。我只需要用大白話撕開怪物的偽裝，把這 14 票的絕對多數拿到手，就能利用系統的規則將牠當場抹殺。」</p>
                    <p>楚戈聽得眼睛發亮，忍不住崇拜地低呼：「也就是說，老大你剛才不是在跟兩千人玩遊戲，你只是把中庭那 14 個人當成了手裡的籌碼？」</p>
                    <p>「可以這麼理解。」凌晏眼中閃過一抹冷冽的微光，「而發訊息挑釁我的這隻狼，顯然當時也站在中庭的 14 人之中。牠看穿了我沒有真正的『預言家驗人天賦』，而是利用物理規律強行抓出了牠的同伴。牠在試探我的底牌。」</p>
                    <p>說話間，兩人已經穿過了兩道厚重的氣壓隔離門，周遭的環境變得愈發壓抑。</p>
                    <p>這裡已經脫離了上層乾淨的甲板，進入了方舟底層的「機艙整備區」。腳下鋪設著帶有防滑紋路的鋼格柵板，透過縫隙可以看見下方幾十米深處、正瘋狂運轉的巨大齒輪與暗沉的機油池。兩側的牆壁上佈滿了如同血管般錯綜複雜的重工業管道，正不斷發出「嘶嘶」的高壓蒸汽洩漏聲。</p>
                    <p>突然，凌晏停下了腳步。<br>單片鏡的熱成像視野裡，前方一間名為「分控調度室」的艙房內，正散發著大片怪異的暗藍色冷光。</p>
                    <p>「老大，有血腥味。很新鮮，不是怪物的，是人類的。」楚戈抽了吹鼻子，身體瞬間緊繃成一塊隨時準備彈射的鋼板，橫移半步擋在凌晏身前。</p>
                    <p>凌晏透過艙門上那面龜裂的厚重防彈玻璃往裡看去。<br>調度室內一片狼藉，三具人類的屍體橫七豎八地倒在血泊中。然而詭異的是，這些屍體上沒有狼人種粗暴的撕裂傷或爪痕，反而全是被銳利的利器一刀割喉，或是被近距離用鈍器砸碎了頭顱。</p>
                    <p>這是人類之間的自相殘殺。</p>
                    <p>「看來，在其他我們看不到的區域，『獵巫恐慌』已經蔓延開了。」凌晏面不改色地推開沉重的舱門，跨過地上的血泊，徑直走到調度室中央那一面巨大的電子監控主機前。</p>
                    <p>This 台主機雖然遭到了部分破壞，但核心的螢幕依然在閃爍著慘白的光芒。<br>螢幕最上方，用血紅色的字體標註著一行不斷跳動的實時數據：</p>

                    <div class="system-msg text-center font-bold">
                        【當前分區（底層動力段）存活人數：84 / 120】<br>
                        【深淵方舟全艦總存活人數：1642 / 2000】
                    </div>

                    <p>看著那正在以每幾分鐘就減少一個的數字，凌晏的眼神愈發深邃。這意味著在短短不到一個小時的時間裡，已經有將近四百名所謂的人類菁英，在各個封閉區域裡被潛伏者獵殺，或是死於同類之間的瘋狂猜忌。</p>
                    <p>「老大，你看這個！」楚戈指著螢幕下方一個正在閃爍的黃色驚嘆號。</p>
                    <p>那是一行系統硬體報警提示：</p>
                    
                    <div class="system-msg">
                        「警告：動力室主要冷卻閥門遭到人為破壞，全艦暖氣系統已鎖定關閉。黑夜模式將強制延長，距離下一次全艦核心主線發布剩餘時間：30分鐘。」
                    </div>

                    <p>「人為破壞……」凌晏修長手指輕輕敲擊著冰冷的控制台，腦海中的線索在這一刻完美串聯了起來。</p>
                    <p>「狼人故意破壞了動力室，想利用極寒和永夜來徹底瓦解人類的心理防線，加速這兩千人的死亡速度。而剛才發訊息挑釁我的那隻狼，很可能正在前往主動力室，準備切斷整艘船的能源。」</p>
                    <p>凌晏轉過頭，看向控制室外那條通往最底層、宛如巨獸食道般幽暗不見底的垂直通道。</p>
                    <p>「楚戈，拿好你的武器。」凌晏冷笑了一聲，鏡片後的雙眸亮得驚人，「留給我們的時間不多了。既然那些怪物想玩，那我們就去動力室，把牠們的硬體開關……親手砸碎。」</p>
                `
            },
            'ch4': {
                title: '第四章：抓到你了，躲在暗處的小狼崽',
                html: `
                    <h3>第四章：抓到你了，躲在暗處的小狼崽</h3>
                    <p>寒風如刀。</p>
                    <p>當主動力室的厚重金屬隔離門向著兩側緩緩滑開時，迎面而來的並非大型機械運轉該有的滾燙熱浪，而是夾雜著密集冰屑的刺骨寒流。</p>
                    <p>原本應該有高壓蒸汽流動的粗壯管線，此刻表面全被敷上了一層厚厚的白霜。動力室最中央那座高達十幾公尺、泛著幽藍光芒的核心能源爐，此時正發出猶如野獸瀕死般的沉悶轟鳴，運轉頻率正以肉眼可見的速度往下掉。</p>
                    <p>「老大，這裡冷得不正常。溫度絕對在零下十五度以下。」楚戈哈出大口大口的白霧，寬闊的肩膀微微沉下，手中的血腥鋼管被他握得劈啪作響。</p>
                    <p>凌晏面不改色，飾冷靜地撥動了左眼上的熱成像單片鏡。視野中的世界瞬間化為一片深淺不一的深藍色極寒領域，然而，在控制台最上方的鋼結構平台上，卻突兀地佇立著一個不合常理的死灰色人影。</p>
                    <p>那個人影體溫低得嚇人，心跳節奏緩慢、且帶著非人的沉重力量感。</p>
                    <p>「啪、啪、啪。」<br>寂靜而空曠的動力室內，突然響起了富有節奏的緩慢掌聲。</p>
                    <p>「不愧是代號『白夜』的犯罪心理學教授。在全艦被獵巫恐慌席捲的時候，你竟然還有心思帶著你的看門狗，一路摸到這裡來。」</p>
                    <p>平台上的人影緩緩走到護欄邊，居高臨下地俯視著底部的兩人。那是一張在幾十分鐘前面熟的面孔——中庭廣場上，那個唯唯諾諾躲在西裝男趙大偉身後、看似膽小怕事的眼鏡女學生。</p>
                    <p>但此刻，她已經摘下了眼鏡，原本怯懦的雙眸盛滿了殘忍與嘲弄。她手裡拋玩著一塊被暴力拆卸下來的核心電路板，冷笑道：<br>「你用物理常識戳破了那個蠢貨的偽裝，確實精彩。但可惜，你來晚了。主冷卻閥已經被我徹底熔毀，動力爐在十分鐘內就會完全停機。這艘方舟，很快就會變成一具漂流在深淵裡的真空冰棺。」</p>
                    <p>她，就是那個發匿名血色訊息挑釁凌晏的第二隻狼。</p>
                    
                    <p class="thought-msg font-medium">
                        看著在平台上侃侃而談的女學生，凌晏腦海中忽然閃過一個先前提及初階狼人時忽略的關鍵問題——「狼人為什麼會說話？」
                    </p>
                    <p>
                        在第一章手環給予的規則裡提到，潛伏者常態下能完美複製人類的外貌、聲音，甚至是記憶。
                        但先前在走廊裡襲擊他們的三隻狼人，在進入黑夜模式、顯露出暴虐型態後，便徹底淪為了野獸，只會發出憤怒、痛苦的嘶吼與低鳴，完全喪失了語言功能。
                    </p>
                    <p>
                        然而，眼前這個女學生，即使此時身體骨骼正發出異變的脆響，額頭隱現血色殘月，卻依然能口齒清晰地用人類的語言冷嘲熱諷。
                    </p>
                    <p class="thought-msg font-medium">
                        防中的差異，本質上是演化階級與智商的斷層。
                    </p>
                    <p>
                        「答案很簡單。」凌晏在心中冷靜地推導出結論：普通的潛伏者在變身後大腦會被殺戮本能吞噬；而眼前這隻，能夠在變身狀態下保持人類智慧與語言能力的，只有一種可能——她是高人一等的<strong>「高階突變種狼人」</strong>。
                    </p>

                    <p>「來晚了？」凌晏雙手優雅地插在休閒西裝褲的口袋裡，微微仰頭看著她，鏡片後的墨色眼眸平靜得沒有泛起一絲波瀾。</p>

                    <p>「在犯罪心理學中，一個人越是缺乏底氣，就越喜歡在言語和姿態上過度強調自己的主導權。」凌晏語速平緩，字字如刀：<br>「你故意熔毀閥門、發訊息引我過來，甚至在這裡等著我，不就證明了你在恐懼嗎？你恐懼下一次裁決會議召開時，我會再度用你無法預防的邏輯，把你也送上斷頭台。所以你急著在黑夜模式結束前，親手抹殺我這個最大的威脅。」</p>
                    <p>平台上的女學生笑容瞬間僵硬在臉上，眼中閃過一抹被看穿的惱羞成怒。</p>
                    <p>「而且，誰告訴你我是來修閥門的？」凌晏嘴角勾起一抹極度冰冷的譏諷弧度，「我職是來……物理超渡你的。」</p>
                    <p>「找死！！」<br>女學生嘴裡發出一聲尖銳的唳嘯，她的身體突然以一種恐怖的幅度膨脹、扭曲！鋼針一般的銀灰色毛髮瞬間刺穿了她的皮膚，雙手暴長出將近半公尺長的倒鉤利爪，額頭中央，更隱隱浮現出一道散發著血光的殘月印記！</p>

                    <div class="system-msg">
                        「警告！戰術小隊已遭遇特殊突變種狼人：【白狼王】（階段性小Boss型態）！」<br>
                        「白狼王特性：除具備極高的敏捷與防禦外，瀕死時將觸發被動技能『白狼自爆』，引爆體內核心引發毀滅性的範圍傷害！」
                    </div>

                    <p>「吼——！！」<br>化身為巨型銀色狼人的白狼王從十公尺高的平台上悍然躍下，龐大的身軀在半空中化作了一道肉眼難辨的銀色閃電，直撲下方的凌晏！</p>
                    <p>「動我老大？你這隻雜毛狗配嗎？！」<br>楚戈一聲暴吼，腳下步法踏碎地面，整個人如同一發點燃的重型砲彈迎面撞了上去，手中的鋼管帶著破空爆音橫掃而出！</p>
                    <p>「砰——！」<br>火花四濺！白狼王在空中精準地用利爪盪開了鋼管。而就在雙方落地的瞬間，白狼王的身形鬼魅般一晃，爆發出了極其恐怖的運動速度！</p>
                    <p>太快了！
                        在極寒的永夜環境中，這隻敏捷型 Boss 的移動速度被催化到了物理極限。空中拉開密密麻麻的銀灰色殘影，破空聲尖銳得幾乎要刺穿耳膜。楚戈甚至連視野都無法捕捉到怪物的實體，作戰服便在火光電石間被風壓刮出數道細密的裂口！
                    </p>
                    <p>「楚戈，閉眼！交出肉體控制權，聽我音節！」<br>凌晏冷澈骨髓的指令在通訊頻道中炸響。然而在這種電光石火的超高速戰鬥中，人類聲帶發聲的物理延遲，竟然成為了最致命的瓶頸——哪怕是凌晏預判到了軌跡，若說出一句完整的指令，等楚戈大腦接收時，也早已成了怪物的爪下魂！</p>
                    <p class="thought-msg font-medium">
                        大腦的預判跟得上，但說話的速度跟不上！
                    </p>
                    <p>
                        「好！」楚戈在生死關頭，毫不猶豫地緊閉雙眼！
                    </p>
                    <p>
                        既然語言會延遲，那就放棄所有的廢話！凌晏一瞬間將大腦的計算率壓榨到極致，左眼單片鏡的運算格網幾乎化為一片綠色洪流。他不再說出任何具有語法的句子，而是將戰術推演直接凝聚成極限的「單音節發音」！
                    </p>
                    <p>
                        零點一秒의預判，零點零一秒的單字吐息。
                    </p>
                    <p>
                        「左！」<br>
                        凌晏聲音未落，楚戈的身體甚至比他的自主意識更快，純靠肌肉記憶往左方一個暴烈側移。呼嘯的利爪擦著他的耳側刮過，帶落幾根黑髮。
                    </p>
                    <p>
                        「挑！」<br>
                        楚戈雙手握緊鐵管，由下至上瘋狂掀起。白狼王快到殘影的身軀，竟然精準無誤地在空中被這一記鐵管重重撩中了腹部，發出一聲沉悶的重擊聲！
                    </p>
                    <p>
                        然而怪物在空中強行扭轉關節，長爪以不可思議的角度反向抓向楚戈的喉嚨。
                    </p>
                    <p>
                        「矮！」<br>
                        楚戈雙膝猛然跪地滑行，險之又險地從白狼王冰冷的利爪下避過。
                    </p>
                    <p>
                        白狼王在地面上輕盈一落，連百分之一秒的停頓都沒有，身形在極限速度中化作一道銀色圓弧，企圖繞到楚戈的視覺死角。
                    </p>
                    <p>
                        「九！砸！」<br>
                        凌晏的單字吐字如機槍掃射般精準而急促！
                    </p>
                    <p>
                        楚戈根本來不及思考「九」是代表九點鐘方向還是別的。他的身體在盲目信任的驅使下，本能地朝著左側全力旋身，手中的精鋼長管帶著萬鈞之勢、如同泰山壓頂般悍然砸下！
                    </p>
                    <p>
                        「咔嚓——轟！」<br>
                        一聲令人牙酸的碎裂聲暴烈炸開。白狼王快如閃電的殘影在一瞬間被迫凝實——牠的右腿膝蓋，竟然在超高速移動中，被楚戈這一記不講道理的盲目重擊精準無比地砸成了粉碎！
                    </p>
                    <p>
                        龐大的狼軀失去平衡，猛地翻滾出去，重重砸在大理石地面上。
                    </p>
                    <p>
                        白狼王掙扎著想爬起來，滿眼都是不可置信的驚恐。牠不明白，為什麼這個人類閉著眼睛，卻能像一具被精準操縱的戰鬥兵器，每一次出手都卡在牠移動軌跡的唯一死角上？！
                    </p>
                    <p>
                        楚戈這才睜開眼，重重吐出一口帶血的濁氣，踩在怪物的胸口上，露出兩排白燦燦的牙齒：「雜毛狗，這就叫降維打擊。」
                    </p>
                    <p>
                        凌晏緩步走到奄奄一息的白狼王面前，語氣依舊毫無波瀾：<br>
                        「資訊差確實是個好東西。但你忘了一件事——在絕對的力量與完美的指揮面前，任何陰謀詭計，都只不過是臨死前的無效掙扎。」
                    </p>
                    <p>
                        就在楚戈準備揮下鋼管給予致命一擊時，凌晏左眼單片鏡中的畫面突然發出刺眼的紅光警報。白狼王胸腔內的深藍色熱源，正以指數級的速度瘋狂飆升，轉眼間化作極度危險的亮白色！
                    </p>
                    <p>
                        白狼王的嘴角咧開一抹瘋狂且同歸於盡的獰笑，牠的身體像充氣的皮球般開始劇烈膨脹，皮下透出耀眼的毀滅性光芒。
                    </p>
                    <p>
                        「楚戈！踢開牠！是『白狼自爆』！」凌晏猛地厲聲喝道。
                    </p>
                    <p>
                        楚戈的反應快到了極致。他沒有絲毫猶豫，放棄了補刀，腰部猛然爆發出恐怖的力量，一腳狠狠踹在白狼王的腹部！
                    </p>
                    <p>
                        "砰！"龐大的狼軀猶如炮彈般被踹飛，直指砸向動力室最深處的厚重金屬廢料堆。
                    </p>
                    <p>
                        「轟隆——！！！」
                    </p>
                    <p>
                        震耳猶聾的爆炸聲響徹整個動力室，狂暴的衝擊波夾雜著高溫火焰席捲而來。楚戈一個飛撲將凌晏死死護在身下，背後的作戰服被飛濺的金屬碎片劃出數道焦痕。
                    </p>
                    <p>
                        當一切歸於平靜，白狼王自爆的中心已經被炸出了一個直徑數公尺的焦黑大坑，連帶周圍的金屬牆壁都被高溫熔化變形。若不是躲避及時，那威力足以讓兩人在瞬間汽化。
                    </p>

                    <div class="system-msg">
                        「叮咚！恭喜戰術小隊成功挺過自爆並擊殺【白狼王】（突變種Boss）！」<br>
                        "獲得方舟積分：3000 點！獲得關鍵劇情道具：【冷卻核心修復模組】×1。"<br>
                        「檢測到突變種死亡，全艦核心主線任務提前引導發布——」
                    </div>

                    <div class="bg-red-950/20 border border-red-900/50 p-5 rounded-lg mt-4 shadow-sm">
                        <h4 class="text-red-500 font-bold mb-3 border-b border-red-900/30 pb-2">【全艦主線任務：第一夜的生存演繹】</h4>
                        <p class="text-sm opacity-80">目前全艦剩餘人數：1641人。底層動力段暖氣已由戰術小隊成功鎖定修復。下一個安全期將在十分鐘後結束。</p>
                        <p class="text-sm text-red-500 font-bold mt-3 bg-red-900/10 inline-block px-3 py-1 rounded">請所有存活的修復者於十分鐘內前往『中央甲板廣場』，真正的『第一夜狼人獵殺與神職判定』即將全面開啟……</p>
                    </div>
                `
            },
            'ch5': {
                title: '第五章：披著神職外衣的跳梁小丑',
                html: `
                    <h3>第五章：披著神職外衣的跳梁小丑</h3>
                    <p>廢土般的動力室內，濃烈的焦糊味與尚未散去的冰屑混合在一起，形成了一種極度刺鼻的氣味。</p>
                    <p>楚戈咳嗽了兩聲，隨手將作戰服上被燒焦的碎片扯下，露出底下結實、線條分明的肌肉。他拍了拍身上的金屬灰燼，轉過身，像一隻忠心耿耿的護衛犬般，伸手將半蹲在地上的凌晏拉了起來。</p>
                    <p>「老大，你沒受傷吧？」楚戈漆黑的眼睛上下打量著凌晏，確認他除了白襯衫沾了點灰塵外毫髮無損，這才滿意地咧嘴一笑。</p>
                    <p>「我沒事。」凌晏優雅地拍了拍衣袖，隨後彎下腰，從白狼王自爆後留下的焦黑深坑中，撿起了一枚散發著幽藍色光芒的菱形晶體——正是系統播報的關鍵劇情道具【冷卻核心修復模組】。</p>
                    <p>他推了推左眼上的熱成像單片鏡，深邃的眼眸中閃過一絲精算的光芒。「這東西既然是全艦級別的『主線道具』，就代表著某種特權。在這種資源極度匱乏的死亡遊戲裡，特權，往往能換來決定性的籌碼。」</p>
                    <p>凌晏將模組收入口袋，轉頭看向動力室深處那台通往上層的重型工業電梯。<br>「走吧，去『中央甲板廣場』。真正的群體博弈，現在才要開始。」</p>

                    <div class="text-center my-8 opacity-40">❖ ❖ ❖</div>

                    <p>十分鐘後。<br>伴隨著工業電梯沉重的鋼纜摩擦聲，巨大的金屬柵門在兩人面前緩緩向兩側拉開。</p>
                    <p>迎面撲來的，不是預想中混亂的喧鬧，而是一股由無數人的汗水、血腥味以及極度恐懼混合而成的……<strong>死寂</strong>。</p>
                    <p>這是一個大到令人窒息的巨大環形空間，規模足以容納兩三個標準足球場。這裡正是方舟的中央腹地——由官方自動化交易終端與玩家自發地攤共同組成的<strong>「中央甲板廣場」</strong>。平日裡，玩家們在這裡以方舟積分或材料，自由交易天賦製作配方、稀有金屬與生存物資。但此刻，這座全艦最大的交易所，卻籠罩在死一般的寂靜中。</p>
                    <p>上千名修復者此刻竟然沒有一個人敢發出聲音。<br>他們全部以一種極度屈辱且恐懼的姿態，雙手抱頭，整整齊齊地跪坐在冰冷的金屬甲板上。交易所周圍，多個官方交易終端螢幕被強行砸毀、鎖定。不遠處的地板上，赫然躺著幾具被強烈雷射高溫汽化、只剩下黑炭般能量餘燼的殘骸，散發著令人作嘔的焦味。</p>
                    <p>凌晏和楚戈剛踏出電梯，腳步便微微一頓。兩人的身形完美地隱沒在邊緣的巨大鋼柱陰影中。</p>
                    <p>「老大……這情況有點不對勁啊。」楚戈壓低了聲音，渾身的肌肉瞬間緊繃，野獸般的直覺讓他嗅到了極度危險的信號。他漆黑的眼眸死死盯著廣場的正中央。</p>
                    <p>在廣場中央、那排唯一的官方主控制終端機前，用廢棄的金屬貨箱堆疊起了一個簡陋的「王座」。</p>
                    <p>一個穿著破爛保全制服、雙眼布滿血絲的瘦弱男人，正大馬金刀地坐在上面。他腳下踩著一個正在瑟瑟發抖的女白領的頭顱，而他的手裡，竟然端著一把散發著耀眼藍藍色雷射光芒、長達一米五的重型科幻狙擊槍！</p>
                    <p>那絕對不是從什麼「初級補給盲盒」裡能開出來的破銅鐵，那是一把帶著系統法則之力的**神職專屬武器**。</p>
                    <p>就在這時，刺耳的系統廣播聲在整個廣場的穹頂轟然炸響！</p>

                    <div class="system-msg">
                        「叮咚！倒數計時結束。歡迎各位倖存的觀測樣本，來到方舟的核心——『中央交易所』！」<br>
                        「第一夜的狂歡，現在正式進入第二階段：【神職覺醒與公投】！」<br>
                        「隱藏在暗處的神明們，請善用你們的權柄；而凡人們，請擦亮你們的雙眼，辨別真偽。」
                    </div>

                    <p>廣播聲一出，王座上的保全男人發出了極度癲狂的尖笑聲。<br>「聽到了嗎？！聽到了嗎你們這群自命不凡的社會菁英！」他猛地站起身，將那把沉重的雷射狙擊槍指向跪在地上的人群，槍口散發的恐怖熱量讓空氣都微微扭曲。</p>
                    <p>「在外面，你們是老闆、是教授、是高管！我只是一個看門的臭保全，每個月領那點連飯都吃不飽的死工資，還要被你們這群西裝狗指著鼻子罵！」保全男人的臉部肌肉因為極度的興奮而扭曲，「但現在呢？在這裡，我買到了【獵人天賦配方】，我做出了神職武器！我是這裡的神！只要我扣下扳機，你們的肉體就會像剛才那兩個白痴一樣瞬間汽化成黑炭！」</p>
                    <p>「規矩很簡單！」保全男人一腳踢開腳下的女白領，朝著被他用武力鎖死的主控制終端機一指，大吼道：<br>「你們這群西裝狗想要活命，就得覺醒天賦對吧？想要天賦，就得來這個交易所購買『天賦配方』對吧？從現在開始，我佔領了所有的交易終端！誰想要過來查閱、購買天賦配方或是交易材料，就必須給我轉讓 <strong>1,000 方舟積分</strong>，或者交出兩件盲盒道具！不給的，我就請他吃雷射！」</p>
                    <p>這是一場徹頭徹尾的暴政。一個在現實中處於社會底層、長期遭受壓迫的靈魂，在突然獲得了凌駕於所有人之上的絕對武力後，徹底崩潰異化成了一個嗜血的暴君。他霸佔了官方的交易系統，企圖強行壟斷天賦配方的購買權，壓榨所有同類的生存資源。</p>
                    <p>而更諷刺的是，一千六百多名各行各業的頂尖菁英，在面對這把不講道理的系統武器時，竟然被「旁觀者效應」死死按在地上，沒有一個人敢站出來反抗。因為誰先站出來，誰就會成為槍下的第一隻出頭鳥。</p>
                    <p>「這傢伙瘋了。」楚戈咬著牙，右手緩緩摸向背後的沾血鋼管，「老大，他的槍有系統加持，威力很大。但我可以利用周圍的掩體，三秒內衝過去扭斷他的脖子。只要你一句话。」</p>
                    <p>「冷靜，楚戈。把武器放下。」<br>凌晏的聲音依舊平穩得像一潭死水，沒有絲毫波瀾。他站在陰影中，左手的食指輕輕推了推熱成像單片鏡的鏡框。</p>
                    <p>「他的心理防線早就崩潰了，現在處於極度的被害妄想與攻擊性代償狀態。你現在衝出去，他絕對會毫不猶豫地開槍。而且……你沒發現嗎？真正危險的，根本不是那個拿槍的瘋子。」</p>
                    <p>楚戈愣了一下，順著凌晏的目光看去。<br>在保全男人的身後，站著四個看起來像是主動投誠、幫他管理這個交易關卡的「狗腿子」。他們正狐假虎威地拿著鐵棍，恐嚇著地上的人群。</p>
                    <p>在凌晏的熱成像視野裡，這四個人中，有三個散發著人類正常的橘紅色體溫。<br>但站在最左邊、那個一直低著頭、看起來最不起眼的瘦高個男人，他的體溫卻呈現出宛如死屍般的**深藍色**。他的體溫只有不到攝氏十五度，心跳慢得幾乎停滯。</p>
                    <p>那是一隻高階潛伏者。<br>牠完美地混入了「暴君」的親衛隊中。牠甚至不需要自己動手殺人，只需要偶爾在保全耳邊煽風點火，這個被權力沖昏頭腦的人類，就會心甘情願地用手裡的槍，幫狼人把其他同類一個一個屠殺殆盡。而牠自己，則能不費吹灰之力地在交易所的終端上，獲得所有死者的資源與天賦配方。</p>
                    <p>「借刀殺人，兵不血刃。這隻狼的智商，比之前那隻白狼王高出了一個維度。」凌晏的嘴角勾起一抹極度冰冷的、充滿戰意的微笑。「走吧，楚戈。我們去給這位『神明』大人，看點魔術。」</p>
                    <p>在全場一千六百人死寂的注視下，凌晏從容地從鋼柱的陰影中邁開了長腿。<br>他沒有舉起雙手，也沒有展現出任何恐懼。他就這樣雙手插在西裝褲口袋裡，踏著優雅而平穩的步伐，一步一步走向廣場中央的王座。</p>
                    <p>「什麼人？！」保全男人立刻宛如驚弓之鳥般猛地轉過身，那把恐怖的雷射狙擊槍瞬間鎖定了凌晏的眉心。「跪下！我叫你跪下沒聽到嗎！」</p>
                    <p>「轟！」<br>就在保全舉槍的瞬間，楚戈高大如鐵塔般的身軀瞬間擋在了凌晏身前！他雙腳微微下沉，金屬甲板甚至被他踩出了兩聲悶響，一雙漆黑的眼眸如同盯著死物般死死盯著保全，渾身上下散發出令人膽寒的狂暴殺氣。</p>
                    <p>楚戈沒有說話，但那姿態已經表達得清清楚楚：你敢扣扳機，我就敢在雷射貫穿我的瞬間，把你的脊椎連根拔起。</p>
                    <p>保全被楚戈那非人的氣勢震懾了一下，拿槍的手不自覺地抖了抖，但他隨即惱羞成怒地咆哮：「你們以為兩個人就了不起嗎？我這是系統武器！是神職！我一槍就能把你們兩個一起打穿！」</p>
                    <p>「是嗎？」<br>凌晏從楚戈身後緩緩走出，他微微揚起下巴，隔著三十公尺的距離，用一種看透一切的、極度輕蔑的眼神俯視著坐在王座上的男人。</p>
                    <p>「一個在現實世界裡只能對著監視器發呆、靠幻想來滿足自尊心的失敗者，偶然用積分買到了天賦配方，就以為自己成了主宰生殺大權的神。」凌晏的聲音不大，卻透過完美的共鳴，清晰地傳遍了整個死寂的廣場。</p>
                    <p>「你剛才殺那兩個人，手抖得很厲害吧？你甚至不敢看他們爆開汽化的模樣，所以你才要這四個人站在你前面擋住你的視線。」</p>
                    <p>保全的臉色瞬間變得慘白，彷彿被扒光了衣服般，歇斯底里地吼道：「你閉嘴！給我閉嘴！信不信我現在就殺了你！」</p>
                    <p>「你不敢。」凌晏精準地踏前一步，語氣如手術刀般一層層剖開對方的心理防線：「因為你知道，那把槍的『獵人審判子彈』是有限的。你剛才已經浪費了兩發在平民身上，你現在不敢確定，如果把最後的子彈浪費在我們身上，等一下真正的狼人撲過來時，你該拿什麼防身？」</p>
                    <p>全場譁然！<br>所有人都震驚地看著這個突然出現、穿著白襯衫的男人。他居然僅憑觀察，就看穿了獵人技能的限制，甚至把這個暴君心底最深處的恐懼赤裸裸地揭露了出來！</p>
                    <p>保全男人的呼吸變得極度急促，槍口開始劇烈搖晃。他被凌晏完全說中了，他之所以要大家把積分與道具交出來，就是因為他的審判子彈快沒了，他需要強行搶奪大家的物資去官方終端兌換彈藥！</p>
                    <p>「而且，最可悲的是……」<br>凌晏的眼神突然變得無比銳利，他猛地抬起手，修長的手指越過保全的肩膀，精準無誤地指向了站在他身後，那個體溫只有十五度的瘦高個男人。</p>
                    <p>「你手裡握著能殺死任何怪物的神兵利器，卻用它來指著手無寸鐵的同類。而你甚至蠢到沒有發現，一隻真正的深淵狼人，就站在距離你脊椎不到一公尺的地方，正笑著看你這隻跳梁小丑為牠表演人類的自相殘殺。牠正等著你打空最後一發子彈，然後，輕易地扭斷你的脖子。」</p>
                    <p>凌晏的話音剛落，保全男人整個人一僵，不可置信地轉過頭。<br>而他身後那個一直低著頭的瘦高個男人，臉上的諂媚與懦弱瞬間消失不見。<br>「咯咯……咯咯咯……」</p>
                    <p>瘦高個的喉嚨裡發出了一陣令人毛骨悚然的詭異笑聲，他的雙眼瞬間變成了毫無人性的豎瞳，嘴角以一個極度誇張的弧度，朝著兩側的耳根，緩緩撕裂開來……</p>
                `
            },
            'ch6': {
                title: '第六章：官方領域的降維規則',
                html: `
                    <h3>第六章：官方領域的降維規則</h3>
                    <p>「噗嗤——！」</p>
                    <p>極限的近距離之下，一抹漆黑的爪尖毫無預警地洞穿了保全男人的肩膀。鮮血在灰敗的霓虹燈光下激射而出，伴隨著骨骼被巨力生生捏碎的「咯吱」聲，慘烈的尖叫響徹了整個交易所。</p>
                    <p>「啊啊啊啊啊！我的手！我的胳膊！」</p>
                    <p>保全男人一邊慘叫著，一邊被那股無法抵抗的怪力像是丟垃圾般扔出了王座。那把重型雷射狙擊槍失手滑落到地面，發出冰冷的金屬碰撞聲。</p>
                    <p>「逃……快逃啊！」<br>看到保全被瞬間廢掉，周圍被他脅迫的上千名平民玩家徹底失去了最後的心理防線。交易所內原本壓抑的死寂在一瞬間引爆，化作狂亂的洪流。眾人驚恐地尖叫著、推搡著，朝著廣場周圍的通道出口瘋狂逃竄，在鋼格柵板上踩踏出如雷的腳步聲。</p>
                    <p>「咯咯咯……愚蠢至極的人類。」<br>異化後的暗影狼人發出低沉、沙啞且夾雜著重音的嘲笑。牠撕開了瘦高個的偽裝皮囊，身軀在雷電般的螢光下瘋狂膨脹至兩米有餘。銀黑色的鋼針毛髮一根根倒豎，一雙充滿暴虐的猩紅豎瞳穿過慌亂的人群，直接鎖定了站在原地一步未退的凌晏與楚戈。</p>
                    <p>「看穿我偽裝的『白夜』……你確實比剛才那個廢物保全要有意思得多。」暗影狼人伸出布滿倒刺的舌頭舔了舔爪尖的血跡，「但我現在要殺你，你憑那隻只會揮舞鐵管的大型犬，拿什麼來擋我？」</p>
                    <p>「呼——！」<br>一陣狂暴的罡風平地颳起，暗影狼人微屈雙腿，腳下的金屬甲板居然被牠生生蹬出了兩個凹坑。牠的速度快到了肉眼難以捕捉的極限，彷彿一道黑色的閃電，直取凌晏的喉嚨！</p>
                    <p>「老大！退後！」<br>楚戈狂吼一聲，雙眼泛起一絲野獸般的微光。他一步踏在凌晏前方，雙手將精鋼鐵管舉在胸前，整個人化作了一道鋼鐵防壁！</p>
                    <p>「鐺——！」<br>狼爪與鐵管激烈相撞，巨力交擊的火花在黑暗中耀眼地爆裂開來。楚戈被這股沛然莫之能禦的衝擊力生生往後推行了整整五公尺，腳下的格柵地板發出刺耳的金屬摩擦拉扯聲。</p>
                    <p>「楚戈！往左滑步，不要與牠拼蠻力！」凌晏的聲音如同冬日裡的冰水，冷徹心扉，卻讓楚戈的神智猛地一清。</p>
                    <p>楚戈在千鈞一髮之際卸下防守，朝著左側一個狼狽但極其流暢的翻滾。果不其然，暗影狼人緊接著而來的連環爪擊在鋼鐵地板上撓出了幾道深達數公分的抓痕！</p>
                    <p>「垂死掙扎！」狼王在半空中優雅地一個折返，再度將利爪對準了空門大開的凌晏。</p>
                    <p>但此時，凌晏竟然連看都沒看牠一眼。<br>在楚戈爭取到的短短三秒鐘內，凌晏已經以極其驚人的速度，衝到了保全男人先前霸占的官方交易所主控制終端機前。</p>
                    <p>看著螢幕上不斷閃爍的『系統警告：底層能源中斷，防禦區關閉』字樣，凌晏冷靜地從西裝口袋中掏出了那一枚散發著幽藍色光芒的【冷卻核心修復模組】。</p>
                    <p>「想看我拿什麼擋你？」<br>凌晏嘴角掛著一抹冰冷的、帶著絕對勝券的嘲諷弧度。他修長的手指一推，將這枚在第四章擊殺白狼王獲得的「全艦主線道具」，狠狠地扣入了控制台的能量卡槽中！</p>
                    <p>「我拿這艘船的官方規則，來碾碎你。」</p>
                    <p>「咔噠！」<br>能量模組入槽的瞬間，原本黯淡的主控面板驟然亮起了耀眼的冰藍色光芒！</p>
                    <p>下一秒，主控大螢幕上的深紅色高亮警報，在一萬分之一秒內被強制改寫成了充滿安全感的翠綠色：</p>
                    
                    <div class="system-msg">
                        「叮咚！檢測到【冷卻核心修復模組】插入，中央交易所主動力源修復成功！」<br>
                        "【中央甲板交易所——官方絕對安全交易區】權限，重新啟動！"<br>
                        「安全規則載入：在交易所登錄範圍內，嚴禁任何非官方授權的暴力行為。違規實體將遭受重力降維壓制。」
                    </div>

                    <p>「什麼？！系統護盾不是已經被……」<br>已經撲到凌晏頭頂上方、利爪距離他只剩半公尺的暗影狼人，面部表情瞬間從殘忍變成了極度的驚恐。</p>

                    if (readArea.scrollTop + readArea.clientHeight >= readArea.scrollHeight - 2) {

                        return;
                    }
                }
                autoScrollInterval = requestAnimationFrame(step);
            };
            autoScrollInterval = requestAnimationFrame(step);

            const isLiked = userSettings.likedChapters[chapterId] || false;
            
            const likeBtn = document.getElementById('btn-like');
            const likeCount = document.getElementById('like-count');
            const likeIcon = document.getElementById('like-icon');

            if (likeCount) likeCount.textContent = data.likes || 0;
            if (likeBtn && likeIcon) {
                if (isLiked) {
                    likeBtn.classList.add('text-rose-500');
                    likeIcon.setAttribute('fill', 'currentColor');
                    likeIcon.classList.add('text-rose-500');
                } else {
                    likeBtn.classList.remove('text-rose-500');
                    likeIcon.setAttribute('fill', 'none');
                    likeIcon.classList.remove('text-rose-500');
                }
            }

            const commentList = document.getElementById('comment-list');
            if (!commentList) return;
            commentList.innerHTML = '';

            let comments = [];
            if (currentUser && db) {
                comments = globalComments
                    .filter(c => c.chapterId === chapterId)
                    .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            } else {
                comments = data.comments || [];
            }

            if (comments.length === 0 && initialInteractions[chapterId] && initialInteractions[chapterId].comments) {
                comments = initialInteractions[chapterId].comments;
            }

            if (comments.length > 0) {
                comments.forEach((comment, index) => {
                    const avatarHtml = comment.avatar 
                        ? `<img src="${comment.avatar}" class="w-8 h-8 rounded-full object-cover border border-slate-600">`
                        : `<div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-slate-400 text-xs font-bold border border-slate-600">${comment.user.substring(0,1)}</div>`;

                    // 計算樓層樣式
                    const floorNum = index + 1;
                    let floorBadge = '';
                    let badgeColor = '';
                    
                    if (floorNum === 1) {
                        floorBadge = '🥇 頭香';
                        badgeColor = 'text-amber-400 border-amber-400/30 bg-amber-400/10';
                    } else if (floorNum === 2) {
                        floorBadge = '🥈 2樓';
                        badgeColor = 'text-slate-300 border-slate-300/30 bg-slate-300/10';
                    } else if (floorNum === 3) {
                        floorBadge = '🥉 3樓';
                        badgeColor = 'text-orange-400 border-orange-400/30 bg-orange-400/10';
                    } else {
                        floorBadge = `${floorNum}樓`;
                        badgeColor = 'text-slate-400 border-slate-600/50 bg-slate-700/30';
                    }

                    commentList.innerHTML += `
                        <div class="bg-black/10 p-4 rounded-lg border border-slate-700/30 shadow-sm flex gap-3 animate-fade-in relative">
                            <div class="flex-shrink-0 mt-1">${avatarHtml}</div>
                            <div class="flex-1">
                                <div class="flex justify-between items-center mb-1">
                                    <div class="flex items-center gap-2">
                                        <span class="font-bold text-sky-500 text-sm">${comment.user}</span>
                                        <span class="text-[10px] px-1.5 py-0.5 rounded border ${badgeColor} font-bold">${floorBadge}</span>
                                    </div>
                                    <span class="text-xs opacity-50">${comment.time}</span>
                                </div>
                                <p class="text-sm whitespace-pre-wrap leading-relaxed opacity-90 mt-1">${comment.text}</p>
                            </div>
                        </div>
                    `;
                });
            } else {
                commentList.innerHTML = '<p class="opacity-50 text-sm text-center py-6 bg-black/5 rounded-lg border border-slate-700/50 border-dashed">目前還沒有留言，快來搶頭香吧！</p>';
            }
        }

        function toggleLike() {
            const chapterId = chapterOrder[currentChapterIndex];
            if (!interactionsData[chapterId]) interactionsData[chapterId] = { likes: 0, comments: [] };
            
            const isLiked = userSettings.likedChapters[chapterId] || false;
            if (isLiked) {
                interactionsData[chapterId].likes = Math.max(0, interactionsData[chapterId].likes - 1);
                userSettings.likedChapters[chapterId] = false;
            } else {
                interactionsData[chapterId].likes++;
                userSettings.likedChapters[chapterId] = true;
            }
            
            saveUserSettings();
            saveInteractions(chapterId);
            renderInteractions(chapterId);
            
            const icon = document.getElementById('like-icon');
            if (icon) {
                icon.classList.add('scale-125', '-translate-y-1');
                setTimeout(() => icon.classList.remove('scale-125', '-translate-y-1'), 200);
            }
        }

        async function submitComment() {
            const input = document.getElementById('comment-input');
            const text = input ? input.value.trim() : '';
            if (!text) return;

            const chapterId = chapterOrder[currentChapterIndex];

            const now = new Date();
            const timeString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            
            const defaultName = currentUser ? `修復者 ${currentUser.uid.substring(0,4).toUpperCase()}` : '匿名讀者';
            const userName = userSettings.userName || defaultName;
            const avatar = userSettings.avatar || '';

            const newComment = {
                chapterId: chapterId,
                user: userName,
                avatar: avatar,
                text: text,
                time: timeString,
                timestamp: Date.now() 
            };

            if (currentUser && db) {
                try {
                    const commentsCol = collection(db, 'artifacts', appId, 'public', 'data', 'comments');
                    await addDoc(commentsCol, newComment);
                } catch(e) {
                    console.error("Firebase send comment failed", e);
                }
            } else {
                if (!interactionsData[chapterId]) interactionsData[chapterId] = { likes: 0, comments: [] };
                interactionsData[chapterId].comments.push(newComment);
                saveInteractions(chapterId);
                renderInteractions(chapterId);
            }

            if (input) input.value = '';
        }

        // --- 個人資料邏輯 ---
        function openProfile() {
            const modal = document.getElementById('profile-modal');
            const input = document.getElementById('profile-name-input');
            if (modal) modal.classList.remove('hidden');
            if (input) input.value = userSettings.userName || '';
            updateProfileAvatarUI(userSettings.avatar);
            updateSocialStatusUI();
        }
        
        function closeProfile() {
            const modal = document.getElementById('profile-modal');
            if (modal) modal.classList.add('hidden');
        }

        function saveProfile() {
            const input = document.getElementById('profile-name-input');
            userSettings.userName = input ? input.value.trim() : '';
            saveUserSettings();
            updateCurrentUserUI();
            closeProfile();
        }

        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const MAX_SIZE = 150;
                    const size = Math.min(img.width, img.height);
                    const startX = (img.width - size) / 2;
                    const startY = (img.height - size) / 2;

                    canvas.width = MAX_SIZE;
                    canvas.height = MAX_SIZE;
                    ctx.drawImage(img, startX, startY, size, size, 0, 0, MAX_SIZE, MAX_SIZE);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    userSettings.avatar = dataUrl;
                    updateProfileAvatarUI(dataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function updateProfileAvatarUI(avatarBase64) {
            const img = document.getElementById('profile-avatar-preview');
            const fallback = document.getElementById('profile-avatar-fallback');
            if (img && fallback) {
                if(avatarBase64) {
                    img.src = avatarBase64;
                    img.classList.remove('hidden');
                    fallback.classList.add('hidden');
                } else {
                    img.classList.add('hidden');
                    fallback.classList.remove('hidden');
                }
            }
        }

        function updateCurrentUserUI() {
            const defaultName = currentUser ? `修復者 ${currentUser.uid.substring(0,4).toUpperCase()}` : '匿名讀者';
            const displayName = userSettings.userName || defaultName;
            
            const commentUser = document.getElementById('comment-user-name');
            if (commentUser) commentUser.textContent = `以 ${displayName} 身分留言`;
            
            const avatarImg = document.getElementById('comment-user-avatar');
            const avatarFallback = document.getElementById('comment-user-fallback');
            
            if (avatarImg && avatarFallback) {
                if (userSettings.avatar) {
                    avatarImg.src = userSettings.avatar;
                    avatarImg.classList.remove('hidden');
                    avatarFallback.classList.add('hidden');
                } else {
                    avatarImg.classList.add('hidden');
                    avatarFallback.classList.remove('hidden');
                    avatarFallback.textContent = displayName.substring(0,1);
                }
            }
        }

        function navigateChapter(direction) {
            if (direction === 'prev' && currentChapterIndex > 0) {
                showChapter(chapterOrder[currentChapterIndex - 1]);
            } else if (direction === 'next' && currentChapterIndex < chapterOrder.length - 1) {
                showChapter(chapterOrder[currentChapterIndex + 1]);
            }
        }

        function updatePaginationButtons() {
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            if (btnPrev && btnNext) {
                btnPrev.disabled = currentChapterIndex === 0;
                btnNext.disabled = currentChapterIndex === chapterOrder.length - 1;
            }
        }

        // --- 社群登入、帳號綁定模擬系統 ---
        function triggerSocialLogin(provider) {
            pendingLoginType = provider;
            
            const modal = document.getElementById('auth-simulator-modal');
            const title = document.getElementById('auth-title');
            const desc = document.getElementById('auth-desc');
            const bg = document.getElementById('auth-icon-bg');
            const iconPlaceholder = document.getElementById('auth-icon-placeholder');
            const progress = document.getElementById('auth-progress');
            
            if (!modal || !title || !desc || !bg || !iconPlaceholder || !progress) return;

            // 初始化進度條
            progress.style.width = '0%';
            
            // 根據不同社群品牌渲染 UI
            if (provider === 'LINE') {
                bg.style.backgroundColor = '#06C755';
                title.textContent = 'LINE 帳號授權連線';
                desc.textContent = '深淵方舟小說網 申請獲得您的公開資料（暱稱、大頭貼）。';
                iconPlaceholder.innerHTML = `<svg class="w-8 h-8 text-white fill-current" viewBox="0 0 24 24"><path d="M24 10.3c0-4.7-5.4-8.5-12-8.5S0 5.6 0 10.3c0 4.2 4.3 7.7 10.1 8.4.4.1.9.3 1 .7l.1 1.6s0 .4-.2.5c-.2.1-.4 0-.4 0l-1.8-1.1c-.2-.1-.5-.1-.7-.1C3.6 20.3 0 15.8 0 10.3 0 4.7 5.4.8 12 .8s12 3.9 12 9.5c0 5.5-5.4 9.5-12 9.5-.7 0-1.4-.1-2.1-.2-.2-.1-.5-.1-.7 0l-1.8 1.1s-.2.1-.4 0c-.2-.1-.2-.5-.2-.5l.1-1.6c.1-.4.5-.6 1-.7 5.8-.7 10.1-4.2 10.1-8.4zm-14.8.9h-1.1v-3.5c0-.2-.2-.4-.4-.4s-.4.2-.4.4v3.9c0 .2.2.4.4.4h1.5c.2 0 .4-.2.4-.4s-.2-.4-.4-.4zm2.7-3.9c0-.2-.2-.4-.4-.4s-.4.2-.4.4v3.9c0 .2.2.4.4.4s.4-.2.4-.4V7.3zm4.5 0h-1.5c-.2 0-.4.2-.4.4v3.9c0 .2.2.4.4.4h1.5c.2 0 .4-.2.4-.4s-.2-.4-.4-.4h-1.1v-1.1h1.1c.2 0 .4-.2.4-.4s-.2-.4-.4-.4h-1.1V8.1h1.1c.2 0 .4-.2.4-.4s-.2-.4-.4-.4zm4.4 1.5h-1.1V7.3c0-.2-.2-.4-.4-.4s-.4.2-.4.4v3.9c0 .2.2.4.4.4h1.5c.2 0 .4-.2.4-.4s-.2-.4-.4-.4h-1.1V9.2h1.1c.2 0 .4-.2.4-.4s-.2-.4-.4-.4z"/></svg>`;
            } else if (provider === 'Google') {
                bg.style.backgroundColor = '#FFFFFF';
                title.textContent = 'Google 帳號安全性驗證';
                desc.textContent = '將使用您的 Google 帳戶電子郵件進行無感安全簽署與綁定。';
                iconPlaceholder.innerHTML = `<svg class="w-8 h-8" viewBox="0 0 24 24"><path fill="#EA4335" d="M12.2 5c1.7 0 3 .6 4 1.5l3-3C17.3 1.7 14.9 1 12.2 1 7.4 1 3.4 3.8 1.4 7.9l3.7 2.9C6 7.3 8.8 5 12.2 5z"/><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.7-.2-2.3H12.2v4.5H18.2c-.3 1.3-1 2.4-2.1 3.1l3.3 2.6C21.3 18.5 23 15.7 23 12.3z"/><path fill="#FBBC05" d="M5.1 14.7c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.4 7.2C.5 9 .1 11 .1 12.4s.4 3.4 1.3 5.2l3.7-2.9z"/><path fill="#34A853" d="M12.2 23c3.2 0 6-1.1 7.9-2.9l-3.3-2.6c-1.1.7-2.6 1.2-4.6 1.2-3.4 0-6.2-2.3-7.2-5.5l-3.7 2.9c2 4.1 6 6.9 10.9 6.9z"/></svg>`;
            } else if (provider === 'Facebook') {
                bg.style.backgroundColor = '#1877F2';
                title.textContent = 'Facebook 安全登入';
                desc.textContent = '與 Facebook 帳戶建立信賴連結，保護您的讀者權益與留言紀錄。';
                iconPlaceholder.innerHTML = `<svg class="w-8 h-8 text-white fill-current" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 3.878 11.023 9.25 12.3l.032-8.7H6.96v-3.6h2.322V10.11c0-2.3 1.373-3.57 3.463-3.57.994 0 2.03.177 2.03.177v2.23H13.78c-1.142 0-1.49.71-1.49 1.434v1.722h2.518l-.403 3.6h-2.115v8.71C19.743 23.364 24 18.068 24 12.073z"/></svg>`;
            }

            modal.classList.remove('hidden');
        }

        function confirmSocialAuth() {
            const progress = document.getElementById('auth-progress');
            const confirmBtn = document.getElementById('btn-auth-confirm');
            
            if (confirmBtn) confirmBtn.disabled = true;
            if (progress) progress.style.width = '100%';

            // 模擬安全驗證的延遲時間
            setTimeout(() => {
                userSettings.loginType = pendingLoginType;
                
                // 自動幫修復者產生對應登入來源的專屬帥氣代號與精美預設大頭貼
                if (pendingLoginType === 'LINE') {
                    userSettings.userName = '綠夜修復者_LINE';
                    userSettings.avatar = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%2306C755"/><circle cx="50" cy="50" r="30" fill="white"/><text x="50" y="55" font-size="16" font-family="sans-serif" font-weight="bold" fill="%2306C755" text-anchor="middle">LINE</text></svg>';
                } else if (pendingLoginType === 'Google') {
                    userSettings.userName = '極客智多星_Google';
                    userSettings.avatar = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%234285F4"/><circle cx="50" cy="50" r="28" fill="white"/><text x="50" y="58" font-size="30" font-family="sans-serif" font-weight="bold" fill="%234285F4" text-anchor="middle">G</text></svg>';
                } else if (pendingLoginType === 'Facebook') {
                    userSettings.userName = '藍海巡航員_FB';
                    userSettings.avatar = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%231877F2"/><circle cx="50" cy="50" r="28" fill="white"/><text x="50" y="60" font-size="36" font-family="sans-serif" font-weight="bold" fill="%231877F2" text-anchor="middle">f</text></svg>';
                }

                saveUserSettings();
                updateCurrentUserUI();
                updateProfileAvatarUI(userSettings.avatar);
                updateSocialStatusUI();

                // 關閉驗證彈窗
                const modal = document.getElementById('auth-simulator-modal');
                if (modal) modal.classList.add('hidden');
                if (confirmBtn) confirmBtn.disabled = false;

                // 彈出歡迎訊息
                const toast = document.createElement('div');
                toast.className = 'fixed top-24 left-1/2 transform -translate-x-1/2 bg-[#06C755] text-white px-5 py-3 rounded-xl shadow-2xl z-50 transition-opacity font-medium text-sm flex items-center gap-2';
                toast.innerHTML = `<span>🎉 登入成功！已綁定 ${pendingLoginType} 帳戶，同步讀者資料中。</span>`;
                document.body.appendChild(toast);
                setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(()=>toast.remove(), 300); }, 3000);

            }, 1200); // 模擬一秒的雲端驗證流程
        }

        function cancelSocialAuth() {
            const modal = document.getElementById('auth-simulator-modal');
            if (modal) modal.classList.add('hidden');
            const confirmBtn = document.getElementById('btn-auth-confirm');
            if (confirmBtn) confirmBtn.disabled = false;
        }

        function updateSocialStatusUI() {
            const line = document.getElementById('status-line');
            const google = document.getElementById('status-google');
            const facebook = document.getElementById('status-facebook');

            if (line) {
                line.textContent = userSettings.loginType === 'LINE' ? '已綁定' : '未綁定';
                line.className = `text-xs px-2 py-0.5 rounded ${userSettings.loginType === 'LINE' ? 'bg-white/20 text-white font-bold' : 'bg-black/20 text-white/70'}`;
            }
            if (google) {
                google.textContent = userSettings.loginType === 'Google' ? '已綁定' : '未綁定';
                google.className = `text-xs px-2 py-0.5 rounded ${userSettings.loginType === 'Google' ? 'bg-sky-100 text-sky-700 font-bold' : 'bg-slate-200 text-slate-600'}`;
            }
            if (facebook) {
                facebook.textContent = userSettings.loginType === 'Facebook' ? '已綁定' : '未綁定';
                facebook.className = `text-xs px-2 py-0.5 rounded ${userSettings.loginType === 'Facebook' ? 'bg-white/20 text-white font-bold' : 'bg-black/20 text-white/70'}`;
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar && overlay) {
                const isClosed = sidebar.classList.contains('-translate-x-full');
                if (isClosed) {
                    sidebar.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
            }
        }

        async function bootApp() {
            const localInteractions = localStorage.getItem('novelInteractions');
            if(localInteractions) interactionsData = JSON.parse(localInteractions);
            
            const localSettings = localStorage.getItem('novelSettings');
            if(localSettings) userSettings = JSON.parse(localSettings);
            
            const hashChapter = window.location.hash.replace('#', '');
            if (chapterOrder.includes(hashChapter)) {
                lastRead = hashChapter;
            } else {
                lastRead = localStorage.getItem('novelLastRead') || 'intro';
            }

            initSettings();
            updateCurrentUserUI();

            if(auth) {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch(e) { console.error("Auth error", e); }

                onAuthStateChanged(auth, async (user) => {
                    if(user) {
                        currentUser = user;
                        
                        // 成功登入雲端後，更新右上角燈號狀態為綠色
                        const statusBadge = document.getElementById('connection-status');
                        if (statusBadge) {
                            statusBadge.className = 'text-[10px] px-2 py-0.5 rounded border border-emerald-500/50 bg-emerald-500/10 text-emerald-500 flex items-center gap-1 font-medium';
                            statusBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> 已連線 (多人同步中)';
                        }

                        await loadUserSettings();
                        initSettings();
                        updateCurrentUserUI();
                        setupCommentsListener(); 
                        showChapter(lastRead);
                    }
                });
            } else {
                showChapter(lastRead);
            }
        }

        bootApp();
    </script>
</body>
